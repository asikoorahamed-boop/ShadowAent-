workflows:
  extract-and-build-apk:
    name: Extract ZIP and Build Universal Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      vars:
        NEXT_TELEMETRY_DISABLED: "1"
        LC_ALL: "en_US.UTF-8"
        LANG: "en_US.UTF-8"
        NODE_OPTIONS: "--max-old-space-size=4096"
    scripts:
      - name: Set up Environment & Node
        script: |
          node -v
          npm -v
          java -version
      - name: Extract ZIP File
        script: |
          echo "Extracting project.zip..."
          unzip -o project.zip -d extracted_app
          cd extracted_app
          if [ -d "ShadowAgent" ]; then
            mv ShadowAgent/* .
          fi
      - name: Install Clean Dependencies
        script: |
          cd extracted_app
          rm -rf node_modules package-lock.json .next out
          npm install --legacy-peer-deps
      - name: Fix Code Issues & Build Static Export
        script: |
          cd extracted_app
          
          # 1. Clean 'use server' directives safely using Node JS
          node -e '
            const fs = require("fs");
            const path = require("path");
            function processDir(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (let entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name !== "node_modules" && entry.name !== ".next") processDir(fullPath);
                } else if (/\.(js|jsx|ts|tsx)$/.test(entry.name)) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  if (content.includes("use server")) {
                    content = content.replace(/["\x27]use server["\x27]/g, "// use server");
                    fs.writeFileSync(fullPath, content, "utf8");
                  }
                }
              }
            }
            processDir(".");
          '

          # 2. Fix calendar.tsx TypeScript Error
          node -e '
            const fs = require("fs");
            const file = "src/components/ui/calendar.tsx";
            if (fs.existsSync(file)) {
              let c = fs.readFileSync(file, "utf8");
              c = c.replace(/IconLeft:/g, "// IconLeft:").replace(/IconRight:/g, "// IconRight:");
              fs.writeFileSync(file, c, "utf8");
            }
          '

          # 3. Create Static Export Config
          cat << 'EOF' > next.config.mjs
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
            webpack: (config, { isServer, webpack }) => {
              if (!isServer) {
                config.resolve.fallback = {
                  ...config.resolve.fallback,
                  perf_hooks: false,
                  dns: false, net: false, tls: false, fs: false,
                  child_process: false, async_hooks: false, http2: false,
                  http: false, https: false, crypto: false, stream: false,
                  os: false, zlib: false, path: false, url: false,
                  v8: false, vm: false, tty: false, readline: false,
                };
                config.plugins.push(
                  new webpack.NormalModuleReplacementPlugin(/^node:/, (resource) => {
                    resource.request = resource.request.replace(/^node:/, '');
                  })
                );
              }
              return config;
            },
          };
          export default nextConfig;
          EOF

          # 4. Clean cache and run export
          rm -rf .next out
          npx next build
      - name: Force Reconfigure Android Manifest & App Identity
        script: |
          cd extracted_app
          rm -rf android
          
          # Force unique config across all files
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "com.shadowagent.v3app",
              appName: "ShadowAgent App",
              webDir: "out"
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            if (fs.existsSync("capacitor.config.ts")) {
              fs.unlinkSync("capacitor.config.ts");
            }
          '
          
          npx cap add android
          npx cap sync android
          
          # Force update Android Strings and Manifest App Name
          node -e '
            const fs = require("fs");
            const stringsPath = "android/app/src/main/res/values/strings.xml";
            if (fs.existsSync(stringsPath)) {
              let s = fs.readFileSync(stringsPath, "utf8");
              s = s.replace(/<string name="app_name">.*?<\/string>/, "<string name=\"app_name\">ShadowAgent App<\/string>");
              fs.writeFileSync(stringsPath, s, "utf8");
            }
          '
      - name: Generate Keystore & Build Release Signed APK
        script: |
          cd extracted_app/android
          chmod +x gradlew
          
          # Generate custom keystore inside android directory
          keytool -genkey -v -keystore release.keystore -storepass mypassword123 -alias mykeyalias -keypass mypassword123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ShadowAgent, O=App, C=US" || true
          
          # Configure build.gradle to automatically sign the APK with generated keystore
          node -e '
            const fs = require("fs");
            const gradlePath = "app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let g = fs.readFileSync(gradlePath, "utf8");
              const signingConfig = `
                signingConfigs {
                    release {
                        storeFile file("release.keystore")
                        storePassword "mypassword123"
                        keyAlias "mykeyalias"
                        keyPassword "mypassword123"
                    }
                }
              `;
              g = g.replace(/android\s*\{/, "android {\n" + signingConfig);
              g = g.replace(/buildTypes\s*\{\s*release\s*\{/, "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n");
              fs.writeFileSync(gradlePath, g, "utf8");
            }
          '
          
          # Build signed release APK
          ./gradlew clean assembleRelease -Dorg.gradle.java.home=$JAVA_HOME
    artifacts:
      - extracted_app/android/app/build/outputs/apk/release/*.apk