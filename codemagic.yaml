workflows:
  extract-and-build-apk:
    name: Extract ZIP and Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18.x
      java: 17
    scripts:
      - name: Extract ZIP File
        script: |
          echo "Extracting project.zip..."
          unzip -o project.zip -d extracted_app
          # Check inside extracted folder
          cd extracted_app
          # Move files to root if nested inside another folder
          if [ -d "ShadowAgent" ]; then
            mv ShadowAgent/* .
          fi
      - name: Install Dependencies
        script: |
          cd extracted_app
          npm install
      - name: Capacitor Android Sync
        script: |
          cd extracted_app
          npx cap add android || true
          npx cap sync android
      - name: Build Debug APK
        script: |
          cd extracted_app/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - extracted_app/android/app/build/outputs/apk/debug/*.apk