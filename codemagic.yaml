workflows:
  extract-and-build-apk:
    name: Extract ZIP and Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.shadowagent.app"
        NEXT_TELEMETRY_DISABLED: "1"
    scripts:
      - name: Set up Node.js
        script: |
          node -v
          npm -v
      - name: Extract ZIP File
        script: |
          echo "Extracting project.zip..."
          unzip -o project.zip -d extracted_app
          cd extracted_app
          if [ -d "ShadowAgent" ]; then
            mv ShadowAgent/* .
          fi
      - name: Install Dependencies
        script: |
          cd extracted_app
          npm install --legacy-peer-deps
      - name: Build Next.js Static Export (Ignoring TS Errors)
        script: |
          cd extracted_app
          npx next build --no-lint
      - name: Capacitor Android Sync
        script: |
          cd extracted_app
          npx cap add android || true
          npx cap sync android
      - name: Build Debug APK
        script: |
          cd extracted_app/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - extracted_app/android/app/build/outputs/apk/debug/*.apk