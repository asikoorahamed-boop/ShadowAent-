workflows:
  extract-and-build-apk:
    name: Extract ZIP and Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.shadowagent.app"
        NEXT_TELEMETRY_DISABLED: "1"
        LC_ALL: "en_US.UTF-8"
        LANG: "en_US.UTF-8"
    scripts:
      - name: Set up Node.js
        script: |
          node -v
          npm -v
      - name: Extract ZIP File
        script: |
          echo "Extracting project.zip..."
          unzip -o project.zip -d extracted_app
          cd extracted_app
          if [ -d "ShadowAgent" ]; then
            mv ShadowAgent/* .
          fi
      - name: Install Dependencies
        script: |
          cd extracted_app
          npm install --legacy-peer-deps
      - name: Fix Config & Build Next.js Export
        script: |
          cd extracted_app
          
          # Fix encoding issue and comment out 'use server'
          export LC_ALL=C
          find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) -exec sed -i '' 's/'\''use server'\''/\/\/ '\''use server'\''/g' {} + || true

          # Create static export config bypassing RSC bundling issues
          cat << 'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
            compiler: {
              removeConsole: false,
            },
            experimental: {
              esmExternals: 'loose',
            },
          };
          module.exports = nextConfig;
          EOF

          # Clean previous next build artifacts and build
          rm -rf .next out
          npx next build
      - name: Capacitor Android Sync
        script: |
          cd extracted_app
          npx cap add android || true
          npx cap sync android
      - name: Build Debug APK
        script: |
          cd extracted_app/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - extracted_app/android/app/build/outputs/apk/debug/*.apk